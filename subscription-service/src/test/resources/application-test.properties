# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Optional - show SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Open Session in View
spring.jpa.open-in-view=false

# Test-only JWT secret (main application.properties now requires JWT_SECRET/DB_PASSWORD env vars,
# which shouldn't be needed just to run the test suite)
jwt.secret=TestOnlySecretKeyForSubscriptionManagementApplicationJWTTests2026
jwt.expiration=86400000